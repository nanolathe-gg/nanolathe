name: Source installer
on:
  push:
    paths:
      - 'tools/installer/**'
      - 'cmd/nanolathe/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/source-installer.yml'
  pull_request:
    paths:
      - 'tools/installer/**'
      - 'cmd/nanolathe/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/source-installer.yml'
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Optional HTTPS release manifest for a full clean install without game assets'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      MANIFEST_URL: ${{ inputs.manifest_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build desktop command with Go alone
        run: go build -o nanolathe-installer-check.exe ./cmd/nanolathe
      - name: Startup and save-directory contracts
        run: go test ./cmd/nanolathe -run 'Installer|SaveDirectory'
      - name: Unix installer failure and launch contracts
        if: runner.os != 'Windows'
        run: python3 tools/installer/test_install.py
      - name: Windows installer failure and launch contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/installer/test-install.ps1
      - name: Clean Unix source install
        if: runner.os != 'Windows' && inputs.manifest_url != ''
        shell: bash
        run: |
          export NANOLATHE_INSTALL_DIR="$RUNNER_TEMP/Nanolathe Install Test"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ['MANIFEST_URL']
          if urlsplit(url).scheme != 'https':
              raise SystemExit('Manifest must use HTTPS')
          script = Path('tools/installer/install.sh').read_text()
          Path(os.environ['RUNNER_TEMP'], 'install-test.sh').write_text(script.replace('https://nanolathe.gg/install/release.txt', url))
          PY
          bash "$RUNNER_TEMP/install-test.sh" --no-run
          "$NANOLATHE_INSTALL_DIR/current/nanolathe" --help
      - name: Clean Windows source install
        if: runner.os == 'Windows' && inputs.manifest_url != ''
        shell: powershell
        run: |
          $env:NANOLATHE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Nanolathe Install Test'
          if (([uri]$env:MANIFEST_URL).Scheme -ne 'https') { throw 'Manifest must use HTTPS' }
          $script = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'tools/installer/install.ps1'))
          & ([scriptblock]::Create($script.Replace('https://nanolathe.gg/install/release.txt', $env:MANIFEST_URL))) -NoRun
          $release = [IO.File]::ReadAllText((Join-Path $env:NANOLATHE_INSTALL_DIR 'current.txt'))
          & (Join-Path (Join-Path (Join-Path $env:NANOLATHE_INSTALL_DIR 'releases') $release) 'nanolathe.exe') --help
          # Exercise the launcher's bounded HTTP client on Windows PowerShell 5.1.
          . ./tools/installer/install.ps1
          $checkPath = Join-Path $env:RUNNER_TEMP 'update-check.txt'
          Get-NanolatheUpdateDownload $env:MANIFEST_URL $checkPath 3
          $available = Read-NanolatheManifest ([IO.File]::ReadAllText($checkPath))
          $installedPath = Join-Path (Join-Path (Join-Path $env:NANOLATHE_INSTALL_DIR 'releases') $release) 'release.txt'
          $installed = Read-NanolatheManifest ([IO.File]::ReadAllText($installedPath))
          if ($available.source_revision -cne $installed.source_revision) { throw 'Update check did not find the installed source release.' }
          Write-Host 'Native update manifest download and comparison passed.'
          $installedExe = Join-Path (Join-Path (Join-Path $env:NANOLATHE_INSTALL_DIR 'releases') $release) 'nanolathe.exe'
          $buildInfo = (& go version -m $installedExe) -join "`n"
          $expectedArch = Resolve-NanolatheWindowsArchitecture @(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Architecture) $true
          if ($buildInfo -notmatch "GOARCH=$expectedArch") { throw 'Installed executable does not match the native CPU.' }
          Write-Host "Installed native Windows $expectedArch executable verified."
      - name: Upload installer diagnostics
        if: always() && inputs.manifest_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/Nanolathe Install Test/logs
          if-no-files-found: ignore
